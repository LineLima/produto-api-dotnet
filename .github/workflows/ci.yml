name: CI

on:
  push:
    branches:
      - main
      - feature/ci-cd
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ProdutoApi.csproj

      - name: Build
        run: dotnet build ProdutoApi.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test ProdutoApi.Tests --configuration Release